[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scf-engine"
version = "0.4.0"
description = "Defensive Web3 smart-contract static and forensic analysis engine"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-solidity==1.2.13",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "httpx>=0.27,<1",
]

[project.scripts]
scf = "scf_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
